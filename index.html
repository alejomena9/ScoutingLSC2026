<title>Scouting LSC 2027</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Oswald:wght@500;600&display=swap">
<style>
/* Single centred card on the dark pitch-green ground; one look in both OS themes on purpose. */
:root{
  --bg:#0B0F0C; --panel:#131A14; --line:#26322A; --fg:#F5F1E9; --muted:#9BA79E; --accent:#3DDC5A; --ink:#0B0F0C; --bad:#E5604D;
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);display:grid;place-items:center;padding-inline:16px;padding-block:24px}
.lg{width:100%;max-width:380px;display:flex;flex-direction:column;gap:22px}
.lg-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.lg-eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lg h1{font:600 38px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:8px 0 0}
.lg-lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.lg-lang button{font:500 11px/1 var(--f-mono);letter-spacing:.08em;padding:6px 10px;background:transparent;color:var(--muted);border:0;cursor:pointer}
.lg-lang button[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=email],input[type=password]{font:15px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 11px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lg-rem{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font:13px var(--f-body);color:var(--fg);cursor:pointer}
.lg-rem input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.lg-go{font:600 14px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--ink);border:0;border-radius:4px;padding:13px;cursor:pointer}
.lg-go[disabled]{opacity:.6;cursor:progress}
.lg-msg{min-height:20px;font-size:13px;color:var(--bad);margin:0}
.lg-foot{font:11px/1.6 var(--f-mono);color:var(--muted);margin:0}
noscript p{color:var(--bad)}
</style>
</head>
<body>
<main class="lg">
  <div class="lg-top">
    <div>
      <div class="lg-eyebrow" data-t="eyebrow">Acceso privado</div>
      <h1>Scouting LSC 2027</h1>
    </div>
    <div class="lg-lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es" aria-pressed="true">ES</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
  </div>
  <form id="lg-form" autocomplete="on">
    <label><span data-t="user">Correo</span><input type="email" id="lg-user" name="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label><span data-t="pass">Contraseña</span><input type="password" id="lg-pass" name="password" autocomplete="current-password" required></label>
    <button class="lg-go" id="lg-go" type="submit" data-t="go">Entrar</button>
    <p class="lg-msg" id="lg-msg" role="alert"></p>
  </form>
  <p class="lg-foot">© 2026 Alejandro Mena · Silas Vance</p>

</main>
